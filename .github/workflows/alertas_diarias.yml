name: Alertas Supply Chain Diarias

on:
  schedule:
    # ── PRODUCCIÓN: 08:40 Perú (UTC-5 fijo, sin horario de verano = 13:40 UTC) Lun-Vie ──
    - cron: '40 13 * * 1-5'

  # Permite disparar el workflow manualmente desde GitHub → Actions → Run workflow
  workflow_dispatch:

jobs:
  send-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Snowflake
      SNOWFLAKE_USER:      ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD:  ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ACCOUNT:   ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_ROLE:      ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE:  ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_SCHEMA:    ${{ secrets.SNOWFLAKE_SCHEMA }}
      # Email
      OUTLOOK_EMAIL:       ${{ secrets.OUTLOOK_EMAIL }}
      OUTLOOK_PASSWORD:    ${{ secrets.OUTLOOK_PASSWORD }}
      SMTP_SERVER:         ${{ secrets.SMTP_SERVER }}
      SMTP_PORT:           ${{ secrets.SMTP_PORT }}
      ALERT_RECIPIENTS:    ${{ secrets.ALERT_RECIPIENTS }}

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Enviar alertas
        run: python scripts/send_daily_alerts.py

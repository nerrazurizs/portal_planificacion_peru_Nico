name: ABC-XYZ Snapshot Diario

on:
  schedule:
    # ── 09:00 Perú (UTC-5 fijo, sin horario de verano) = 14:00 UTC — todos los días ──
    - cron: '0 14 * * *'

  # Permite disparar manualmente desde GitHub → Actions → Run workflow
  workflow_dispatch:

permissions:
  contents: write   # necesario para hacer commit del .parquet generado

jobs:
  save-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SNOWFLAKE_USER:      ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD:  ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ACCOUNT:   ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_ROLE:      ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE:  ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_SCHEMA:    ${{ secrets.SNOWFLAKE_SCHEMA }}

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar snapshot ABC-XYZ
        run: python scripts/save_abc_xyz_snapshot.py

      - name: Commit y push del snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/abc_xyz_snapshots/
          # Solo commitear si hay cambios (evita commits vacíos si el snapshot ya existía)
          git diff --cached --quiet || git commit -m "Snapshot ABC-XYZ $(date -u '+%Y-%m-%d')"
          git push
